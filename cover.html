<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #0A1128; 
      display: flex; 
      flex-direction: column; 
      padding: 48px;
      position: relative;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
    }
    .top-accent {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #FF6B35;
    }
    .slide-number {
      position: absolute;
      top: 48px;
      right: 48px;
      font-family: monospace;
      font-size: 18px;
      color: #94A3B8;
    }
    .content-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 48px;
    }
    .title-accent {
      width: 120px;
      height: 8px;
      background: #FF6B35;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      line-height: 1.1;
      margin-bottom: 16px;
      max-width: 800px;
    }
    .subtitle {
      font-size: 24px;
      color: #94A3B8;
      max-width: 600px;
    }
    .footer-note {
      position: absolute;
      bottom: 48px;
      left: 48px;
      font-size: 14px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top-accent"></div>
    <div class="slide-number">01</div>
    <div class="content-zone">
      <div class="title-accent"></div>
      <h1>SkillFusion Production QA Summary</h1>
      <p class="subtitle">Final status report, verified fixes, and pre-launch technical audit for the 2026-09-15 release.</p>
    </div>
    <div class="footer-note">Manus AI | Production QA Report</div>
  </div>
</body>
</html>

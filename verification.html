<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #0A1128; 
      display: flex; 
      flex-direction: column; 
      padding: 48px;
      position: relative;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
    }
    .top-accent {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #FF6B35;
    }
    .slide-number {
      position: absolute;
      top: 48px;
      right: 48px;
      font-family: monospace;
      font-size: 18px;
      color: #94A3B8;
    }
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      margin-bottom: 48px;
      padding-top: 24px;
    }
    .metric-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 24px;
    }
    .metric-card {
      background: #162032;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid #1E293B;
    }
    .metric-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      color: #FF6B35;
      margin-bottom: 8px;
    }
    .metric-label {
      font-size: 14px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-status {
      margin-top: 16px;
      font-family: monospace;
      font-size: 14px;
      color: #22C55E;
    }
    .footer-note {
      margin-top: auto;
      font-size: 14px;
      color: #94A3B8;
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top-accent"></div>
    <div class="slide-number">05</div>
    <h2>Final verification</h2>
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-value">0</div>
        <div class="metric-label">Page Errors</div>
        <div class="metric-status">VERIFIED</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">390px</div>
        <div class="metric-label">Mobile Width</div>
        <div class="metric-status">NO OVERFLOW</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">100%</div>
        <div class="metric-label">Anchor Health</div>
        <div class="metric-status">ALL TARGETS VALID</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">6</div>
        <div class="metric-label">Active Canvases</div>
        <div class="metric-status">3D OPERATIONAL</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">VALID</div>
        <div class="metric-label">Form Submission</div>
        <div class="metric-status">INPUTS VERIFIED</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">PASS</div>
        <div class="metric-label">Mobile Menu</div>
        <div class="metric-status">ARIA SYNCED</div>
      </div>
    </div>
    <div class="footer-note">Results confirmed via Playwright QA Runner (2026-09-15T17:40:20).</div>
  </div>
</body>
</html>
